<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background-color: #f3f4f6;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="max-width: 560px; margin: 0 auto; background-color: #ffffff; border-radius: 12px;"
    >
      <tr>
        <td style="padding: 40px 32px; text-align: center;">
          <h1 style="margin: 0 0 16px; font-size: 24px; color: #111827;">
            Verify your email
          </h1>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px;">
            Enter this one-time code to continue:
          </p>
          <p
            style="
              display: inline-block;
              margin: 0 0 24px;
              padding: 16px 28px;
              border-radius: 8px;
              background-color: #f3f4f6;
              color: #111827;
              font-size: 32px;
              font-weight: 700;
              letter-spacing: 8px;
            "
          >
            {{otp}}
          </p>
          <p style="margin: 0 0 12px; font-size: 14px; line-height: 22px;">
            This code expires in 3 minutes and was requested for
            <strong>{{email}}</strong>.
          </p>
          <p style="margin: 0; color: #6b7280; font-size: 13px; line-height: 20px;">
            If you didn't request this code, you can safely ignore this email.
            Please don't share your code with anyone.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
